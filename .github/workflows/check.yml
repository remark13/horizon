name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: horizon
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: horizon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horizon -d horizon_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Ephemeral isolated CI service, not deployment credentials.
      SAIA_DATABASE_URL: postgresql://horizon:ci-only@127.0.0.1:5432/horizon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev,db,web,bulk]'
      - run: python -m saia.db migrate
      - run: python scripts/check_repository.py
      - run: python scripts/init_repository_env.py
      - run: docker compose --env-file .env config --quiet
      - run: python scripts/build_repository_bundle.py --output /tmp/horizon-checked.zip
