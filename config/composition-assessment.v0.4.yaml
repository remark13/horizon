interpretation: >
  Оценка конкретного состава внутри замороженного корпуса. Пороги и
  процентильная новизна экспериментальны, не подтверждают истинность
  слабого сигнала, первичный результат, независимость лабораторий или рынок.
  Порог 1% для распространённости — некалиброванная гипотеза: высокий
  процентиль среди редких фраз сам по себе не означает массовую тему.
