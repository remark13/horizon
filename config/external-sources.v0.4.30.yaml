version: external-sources-0.4.30
scientific_score_modified: false

news:
  source: gdelt_doc_2_0
  role: news_attention_only
  base_url: https://api.gdeltproject.org/api/v2/doc/doc
  max_lookback_days: 93
  max_records: 50
  stores_article_text: false
  credentials: none
  evidence_urls:
    - https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
    - https://blog.gdeltproject.org/doc-2-0-updates-1-5-year-searching-and-updated-mobile-interface/
  limitation: >-
    ArticleList is used only for a bounded recent window. Results are capped,
    source coverage is unequal, and zero returned articles does not prove that
    no event occurred outside GDELT coverage.

patents:
  source: epo_ops
  role: patent_landscape_only
  token_url: https://ops.epo.org/3.2/auth/accesstoken
  search_url: https://ops.epo.org/3.2/rest-services/published-data/search/biblio
  max_records: 25
  stores_full_text: false
  credentials:
    kind: oauth_client_credentials
    key_env: EPO_OPS_CONSUMER_KEY
    secret_env: EPO_OPS_CONSUMER_SECRET
  free_allowance: Up to 4 GB per week for registered non-paying users.
  evidence_urls:
    - https://www.epo.org/en/searching-for-patents/data/web-services/ops
    - https://ops.epo.org/wsdl/ops.yaml
  limitation: >-
    OPS search is not available without EPO registration and OAuth credentials.
    Patent publications are lagged, family duplicates are possible, and a
    keyword hit is not evidence of grant, commercialisation or market success.

funding:
  source: nih_reporter
  role: research_funding_only
  search_url: https://api.reporter.nih.gov/v2/projects/search
  max_records: 50
  max_response_bytes: 5000000
  credentials: none
  evidence_urls:
    - https://api.reporter.nih.gov/
  limitation: >-
    RePORTER is strongest for NIH and participating US federal agencies. An
    award is evidence of funded activity, not proof of a successful technology,
    and repeated project-year records must not be treated as independent grants.

software:
  source: deps_dev
  role: software_diffusion_only
  package_url: https://api.deps.dev/v3/systems/{system}/packages/{package}
  max_versions: 100
  max_response_bytes: 3000000
  allowed_systems: [pypi, npm, maven, go, cargo, nuget, rubygems]
  credentials: none
  evidence_urls:
    - https://docs.deps.dev/api/v3/
  limitation: >-
    deps.dev requires an exact package identity and is not a technology keyword
    search. Package releases show software activity, not adoption, quality or
    commercial success; current inventory is unsuitable for strict historical replay.

scholar:
  source: semantic_scholar
  role: bibliographic_enrichment_only
  search_url: https://api.semanticscholar.org/graph/v1/paper/search
  max_records: 50
  max_response_bytes: 5000000
  credentials:
    kind: optional_api_key
    key_env: SEMANTIC_SCHOLAR_API_KEY
    header: x-api-key
  evidence_urls:
    - https://api.semanticscholar.org/api-docs
  limitation: >-
    Semantic Scholar overlaps OpenAlex and arXiv and therefore is enrichment,
    not independent publication evidence. Citation counts are current and can
    leak future information into retrospective evaluation. Anonymous access can
    be heavily rate-limited.
