version: external-sources-0.4.31
scientific_score_modified: false

news:
  source: gdelt_doc_2_0
  role: news_attention_only
  base_url: https://api.gdeltproject.org/api/v2/doc/doc
  max_lookback_days: 93
  max_records: 50
  stores_article_text: false
  credentials: none
  evidence_urls:
    - https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
  limitation: >-
    ArticleList is a capped recent view with unequal coverage. Zero results do
    not prove that no event occurred outside GDELT coverage.

patents:
  source: epo_ops
  role: patent_landscape_only
  token_url: https://ops.epo.org/3.2/auth/accesstoken
  search_url: https://ops.epo.org/3.2/rest-services/published-data/search/biblio
  max_records: 25
  stores_full_text: false
  credentials:
    kind: oauth_client_credentials
    key_env: EPO_OPS_CONSUMER_KEY
    secret_env: EPO_OPS_CONSUMER_SECRET
  evidence_urls:
    - https://www.epo.org/en/searching-for-patents/data/web-services/ops
  limitation: >-
    OPS needs registration and credentials. Patent publications are lagged,
    family duplicates are possible, and a hit is not evidence of grant or use.

funding:
  source: nih_reporter
  role: research_funding_only
  search_url: https://api.reporter.nih.gov/v2/projects/search
  max_records: 50
  max_response_bytes: 5000000
  credentials: none
  evidence_urls:
    - https://api.reporter.nih.gov/
  limitation: >-
    RePORTER is strongest for NIH and participating US agencies. An award is
    funded activity, not proof of a successful technology; project-year rows
    must not be treated as independent grants.

software:
  source: deps_dev
  role: software_diffusion_only
  package_url: https://api.deps.dev/v3/systems/{system}/packages/{package}
  max_versions: 100
  max_response_bytes: 3000000
  allowed_systems: [pypi, npm, maven, go, cargo, nuget, rubygems]
  credentials: none
  evidence_urls:
    - https://docs.deps.dev/api/v3/
  limitation: >-
    deps.dev needs an exact package identity. Releases show activity, not
    adoption or market success; current inventory is not a strict historical snapshot.

scholar:
  source: semantic_scholar
  role: bibliographic_enrichment_only
  search_url: https://api.semanticscholar.org/graph/v1/paper/search
  max_records: 50
  max_response_bytes: 5000000
  credentials:
    kind: optional_api_key
    key_env: SEMANTIC_SCHOLAR_API_KEY
    header: x-api-key
  evidence_urls:
    - https://api.semanticscholar.org/api-docs
  limitation: >-
    Semantic Scholar overlaps OpenAlex and arXiv. Current citation counts can
    leak future information and anonymous access may be heavily rate-limited.

uk_funding:
  source: ukri_gtr
  role: research_funding_only
  search_url: https://gtr.ukri.org/api/search/project
  max_records: 50
  source_page_size: 25
  max_response_bytes: 5000000
  credentials: none
  evidence_urls:
    - https://gtr.ukri.org/resources/gtrapi.html
  limitation: >-
    Gateway to Research search is relevance-ranked and can match individual
    query terms. Returned grants are UK-centred funded activity, not proof of
    technology success, market adoption or an exhaustive result set.

eu_programmes:
  source: eu_funding_tenders
  role: research_programme_only
  search_url: https://api.tech.ec.europa.eu/search-api/prod/rest/search
  public_api_key: SEDIA
  max_records: 20
  max_response_bytes: 6000000
  credentials: none
  evidence_urls:
    - https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/support/apis
  limitation: >-
    The corporate search mixes several content types and is relevance-ranked.
    SAIA retains only deduplicated English topic cards in the requested date
    window; the bounded first page is not an exhaustive programme history.

ai_artifacts:
  source: huggingface_hub
  role: ai_artifact_diffusion_only
  base_url: https://huggingface.co/api
  surfaces: [models, datasets, spaces]
  max_records: 20
  max_response_bytes: 3000000
  credentials: none
  evidence_urls:
    - https://huggingface.co/docs/hub/api
  limitation: >-
    Hub search is mutable and can contain spam, mirrors and near-duplicates.
    Downloads and likes are current counters, not historical adoption; authors
    are not verified as independent organisations.
