    temporal_coverage: Current recent feed only.
    regional_coverage: NASA JPL institutional announcements, United States.
    access: Official public RSS; bounded connector. Initial direct probe returned HTTP 403; live availability is not presumed.
    credentials: none
    cost: Public feed, no subscription documented.
