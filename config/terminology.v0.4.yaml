  - статья
  - метод
  - результаты
interpretation: >
  Повторяющиеся буквальные сочетания, не автоматически выделенные понятия
  и не детектор слабых сигналов. Нет скрытого целевого словаря, объединения
  синонимов, лемматизации или доказательства новизны вне загруженного корпуса.
