version: "lexical-0.4-experimental"
ngram_lengths: [2, 3]
min_document_support: 2
max_candidates: 100
max_singletons: 25
max_contexts_per_phrase: 3
context_radius_chars: 120
max_token_chars: 40
max_corpus_works: 20000
max_document_chars: 100000
stopwords:
